# 열쇠(API 키·비밀번호)가 코드에 섞여 올라오는지 푸시·PR마다 전체 이력을 검사한다.
# 공개 저장소라 열쇠가 올라가면 평균 4분 안에 털린다(크리밋 기준 0923).
# 걸리면 이 검사가 빨간불이 되고, 열쇠는 즉시 폐기·재발급한다(코드에서 지우는 것만으로는 안 된다).
name: secret-scan

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 전체 이력을 본다
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
